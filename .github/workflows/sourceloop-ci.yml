name: SourceLoop CI

on:
  push:
    branches:
      - main
      - feature/sourceloop-direct-source-intelligence-mvp
    paths:
      - "sourceloop/**"
      - ".github/workflows/sourceloop-ci.yml"
  pull_request:
    paths:
      - "sourceloop/**"
      - ".github/workflows/sourceloop-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sourceloop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sourceloop/pyproject.toml
      - name: Install backend and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest
      - name: Build wheel and verify packaged vertical manifests
        run: |
          python -m pip wheel . --no-deps --wheel-dir /tmp/sourceloop-wheel
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("/tmp/sourceloop-wheel/sourceloop-*.whl")
          assert len(wheel) == 1, wheel
          with zipfile.ZipFile(wheel[0]) as archive:
              names = set(archive.namelist())
          expected = {
              "sourceloop/vertical_packs/civic_intelligence.yaml",
              "sourceloop/vertical_packs/facilities_quote.yaml",
              "sourceloop/vertical_packs/bpo_quote.yaml",
          }
          missing = expected - names
          assert not missing, f"Missing packaged vertical manifests: {sorted(missing)}"
          PY
      - name: Exercise deterministic CLI demo
        run: |
          SOURCELOOP_DATABASE_URL=sqlite:////tmp/sourceloop-ci-demo.db \
            sourceloop demo --kind facilities_quote > /tmp/sourceloop-demo.json
      - name: Publish deterministic demo receipt
        uses: actions/upload-artifact@v4
        with:
          name: sourceloop-demo-receipt
          path: /tmp/sourceloop-demo.json
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sourceloop/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
      - name: Publish operator console build
        uses: actions/upload-artifact@v4
        with:
          name: sourceloop-console
          path: sourceloop/frontend/dist
          if-no-files-found: error
