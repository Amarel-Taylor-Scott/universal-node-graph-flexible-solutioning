name: Repair SourceLoop v0.3.1 tests

on:
  push:
    branches:
      - feature/sourceloop-direct-source-intelligence-mvp
    paths:
      - ".github/workflows/sourceloop-fix-v031.yml"

permissions:
  contents: write

concurrency:
  group: sourceloop-v031-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic repairs
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path


          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text(encoding="utf-8")
              if old not in content:
                  raise SystemExit(f"Expected repair target not found in {path}: {old!r}")
              target.write_text(content.replace(old, new, 1), encoding="utf-8")


          replace_once(
              "sourceloop/src/sourceloop/__init__.py",
              '__version__ = "0.3.0"',
              '__version__ = "0.3.1"',
          )
          replace_once(
              "sourceloop/src/sourceloop/api.py",
              'version="0.3.0",',
              'version="0.3.1",',
          )
          replace_once(
              "sourceloop/src/sourceloop/api.py",
              '"version": "0.3.0",',
              '"version": "0.3.1",',
          )
          replace_once(
              "sourceloop/pyproject.toml",
              'version = "0.3.0"',
              'version = "0.3.1"',
          )
          replace_once(
              "sourceloop/tests/test_api.py",
              'assert runtime["version"] == "0.2.0"',
              'assert runtime["version"] == "0.3.1"',
          )

          replace_once(
              "sourceloop/src/sourceloop/investigation.py",
              '        questions.append(field.question if field else f"Please clarify {field_id.replace(\'_\', \' \')}.")\n',
              '        questions.append(\n'
              '            f"{field.label}: {field.question}"\n'
              '            if field\n'
              '            else f"Please clarify {field_id.replace(\'_\', \' \')}."\n'
              '        )\n',
          )
          replace_once(
              "sourceloop/src/sourceloop/investigation.py",
              '    pay_rate = _first_number(body, [r"(?:worker |candidate )?pay rate(?: is| of)?\\s*\\$([\\d,]+(?:\\.\\d+)?)"])\n',
              '    pay_rate = _first_number(\n'
              '        body,\n'
              '        [\n'
              '            r"(?:worker |candidate )?pay rate(?: is| of)?\\s*\\$([\\d,]+(?:\\.\\d+)?)",\n'
              '            r"\\$([\\d,]+(?:\\.\\d+)?)\\s*(?:worker |candidate )?pay rate",\n'
              '            r"using\\s+(?:a\\s+)?\\$([\\d,]+(?:\\.\\d+)?)\\s*pay rate",\n'
              '        ],\n'
              '    )\n',
          )

          replace_once(
              "sourceloop/tests/test_policy.py",
              "from sourceloop.domain import ActionProposal, ActionStatus, CaseKind, CaseRecord\n",
              "from sourceloop.domain import ActionProposal, ActionStatus, CaseKind, CaseRecord, ContactRoute\n",
          )
          replace_once(
              "sourceloop/tests/test_policy.py",
              '        requester_name="Analyst",\n    )\n    action = ActionProposal(\n        status=ActionStatus.APPROVED,\n',
              '        requester_name="Analyst",\n'
              '        contacts=[\n'
              '            ContactRoute(\n'
              '                organization_name="Example Organization",\n'
              '                role_title="Public contact",\n'
              '                endpoint="person@example.com",\n'
              '            )\n'
              '        ],\n'
              '    )\n'
              '    action = ActionProposal(\n'
              '        status=ActionStatus.APPROVED,\n',
          )

          replace_once(
              "sourceloop/tests/test_mail.py",
              "from sourceloop.domain import ActionProposal, ActionStatus, CaseKind, CaseRecord\n",
              "from sourceloop.domain import ActionProposal, ActionStatus, CaseKind, CaseRecord, ContactRoute\n",
          )
          replace_once(
              "sourceloop/tests/test_mail.py",
              '        requester_name="Test Buyer",\n    )\n    action = ActionProposal(\n',
              '        requester_name="Test Buyer",\n'
              '        contacts=[\n'
              '            ContactRoute(\n'
              '                organization_name="Example Supplier",\n'
              '                role_title="Quote desk",\n'
              '                endpoint="supplier@example.com",\n'
              '            )\n'
              '        ],\n'
              '    )\n'
              '    action = ActionProposal(\n',
          )
          PY

      - name: Compile and run targeted tests
        working-directory: sourceloop
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src tests
          ruff check src tests
          pytest tests/test_api.py tests/test_investigation.py tests/test_mail.py tests/test_policy.py

      - name: Commit repairs and retire workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sourceloop-fix-v031.yml
          git add -A sourceloop
          git commit -m "fix: complete SourceLoop v0.3.1 investigation validation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
