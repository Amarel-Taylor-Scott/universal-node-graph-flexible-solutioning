name: Materialize SourceLoop v0.3 investigation platform

on:
  push:
    branches:
      - feature/sourceloop-direct-source-intelligence-mvp
    paths:
      - ".sourceloop-materialize.part*"
      - ".github/workflows/sourceloop-materialize.yml"

permissions:
  contents: write

concurrency:
  group: sourceloop-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect payload parts
        id: payload
        shell: bash
        run: |
          if compgen -G '.sourceloop-materialize.part*' >/dev/null; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify and extract payload
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import shutil
          import tarfile
          from pathlib import Path, PurePosixPath

          expected = "764d1ca095135965472bf874183fc42b844f00710b38b7161b87d2c25f5f449d"
          parts = sorted(Path(".").glob(".sourceloop-materialize.part*"))
          if not parts:
              raise SystemExit("No payload parts were found")

          encoded = "".join(part.read_text(encoding="utf-8") for part in parts)
          archive = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          if digest != expected:
              raise SystemExit(f"Payload checksum mismatch: {digest}")

          archive_path = Path("/tmp/sourceloop-materialize.tar.gz")
          staging = Path("/tmp/sourceloop-materialize")
          shutil.rmtree(staging, ignore_errors=True)
          staging.mkdir(parents=True)
          archive_path.write_bytes(archive)

          with tarfile.open(archive_path, "r:gz") as bundle:
              members = bundle.getmembers()
              unsafe: list[str] = []
              for member in members:
                  normalized = member.name.removeprefix("./")
                  path = PurePosixPath(normalized)
                  allowed = normalized == "sourceloop" or normalized.startswith("sourceloop/")
                  if (
                      not allowed
                      or path.is_absolute()
                      or ".." in path.parts
                      or member.issym()
                      or member.islnk()
                  ):
                      unsafe.append(member.name)
              if unsafe:
                  raise SystemExit(f"Unsafe archive entries: {unsafe[:5]}")
              bundle.extractall(staging, filter="data")

          source = staging / "sourceloop"
          if not source.is_dir():
              raise SystemExit("Payload did not contain a sourceloop directory")
          shutil.copytree(source, Path("sourceloop"), dirs_exist_ok=True)

          for part in parts:
              part.unlink()
          print(f"Materialized {len(members)} paths from {len(parts)} verified parts")
          PY

      - name: Commit materialized application
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A sourceloop .sourceloop-materialize.part\*
          if git diff --cached --quiet; then
            echo "No materialized changes to commit"
            exit 0
          fi
          git commit -m "feat: add governed active-market investigation platform"
          git push origin "HEAD:${GITHUB_REF_NAME}"
