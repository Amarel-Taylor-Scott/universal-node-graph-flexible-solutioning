name: CI

on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The core is stdlib-only, so it must pass with no browser and no network.
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -e ".[dev]"
      - name: Tests that need no browser
        run: pytest tests -q --ignore=tests/test_corpus.py
                            --ignore=tests/test_engines.py
                            --ignore=tests/test_isolation.py
      - run: solutiongraph doctor
      - run: solutiongraph conformance
      - name: Compile, execute, and verify every reference route
        run: solutiongraph verify --catalog-root catalog

  # The suites that exercise real drivers.
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [playwright, patchright, selenium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev,${{ matrix.engine }}]"
      - name: Install browser
        run: |
          if [ "${{ matrix.engine }}" = "playwright" ]; then playwright install --with-deps chromium; fi
          if [ "${{ matrix.engine }}" = "patchright" ]; then patchright install --with-deps chromium; fi
      - run: pytest tests/test_engines.py tests/test_corpus.py -q

  # Camoufox conflicts with the shared playwright pin, so it only runs isolated.
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      # Build the isolated env the live tests need; the rest skip without it.
      - run: python -m browsergraph.cli envs create --name playwright
      - run: pytest tests/test_isolation.py -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install ruff
      - run: ruff check browsergraph solutiongraph tests/test_solutiongraph*.py scripts/export_solutiongraph_catalog.py scripts/sync_catalog_explorer.py
      - run: python -m compileall -q browsergraph solutiongraph

  package:
    needs: [core, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install build twine
      - run: python scripts/check_release_version.py
      - run: python -m build
      - run: twine check dist/*
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/solutiongraph-wheel-test
          /tmp/solutiongraph-wheel-test/bin/pip install dist/*.whl
          /tmp/solutiongraph-wheel-test/bin/solutiongraph doctor
          /tmp/solutiongraph-wheel-test/bin/solutiongraph conformance
          /tmp/solutiongraph-wheel-test/bin/solutiongraph verify --runtime in-process
          /tmp/solutiongraph-wheel-test/bin/solutiongraph verify --runtime subprocess
          /tmp/solutiongraph-wheel-test/bin/solutiongraph agent-bench smoke \
            --repo-root "$GITHUB_WORKSPACE" \
            --output /tmp/solutiongraph-wheel-agent-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
