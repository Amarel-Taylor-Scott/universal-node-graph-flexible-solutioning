id: civic_intelligence
name: Civic Infrastructure Intelligence
description: Transparent verification of public organizations, service areas, inquiry routes, meetings, and referrals.
case_kind: civic_intelligence
max_contacts: 3
max_followups: 1
completion_target: 1
required_fields:
  - geography
optional_fields:
  - purpose
  - organization_type
  - issue
specialist_roles:
  - jurisdiction_resolver
  - official_source_scout
  - public_role_resolver
  - message_composer
  - claim_auditor
prohibited_actions:
  - political_persuasion
  - fundraising
  - hidden_requester
  - private_profile_scraping
  - residential_mapping
  - attendee_identification
question_prompts:
  - Which public organization serves the stated geography?
  - Which public role handles this inquiry?
  - What official meeting or information resource is current?
  - Is another organization a more appropriate referral?
followup_approval_required: true
