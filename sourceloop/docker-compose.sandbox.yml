services:
  mail:
    image: greenmail/standalone:2.1.13
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
        -Dgreenmail.api.hostname=0.0.0.0
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled
        -Dgreenmail.users=sourceloop:devpassword@sourceloop.local,supplier1:devpassword@supplier.local,supplier2:devpassword@supplier.local
    ports:
      - "${SOURCELOOP_SANDBOX_SMTP_PORT:-3025}:3025"
      - "${SOURCELOOP_SANDBOX_IMAP_PORT:-3143}:3143"
      - "${SOURCELOOP_SANDBOX_API_PORT:-8085}:8080"
    networks:
      - backend

  api:
    environment:
      SOURCELOOP_ENVIRONMENT: sandbox
      SOURCELOOP_DATABASE_URL: postgresql+psycopg://sourceloop:${SOURCELOOP_DB_PASSWORD:-change-me-local}@db:5432/sourceloop
      SOURCELOOP_EVIDENCE_DIR: /data/evidence
      SOURCELOOP_AGENT_RUNTIME: mock
      SOURCELOOP_EMAIL_MODE: smtp
      SOURCELOOP_ALLOW_EXTERNAL_SEND: "true"
      SOURCELOOP_SENDER_NAME: SourceLoop Sandbox
      SOURCELOOP_SENDER_EMAIL: sourceloop@sourceloop.local
      SOURCELOOP_REPLY_TO_EMAIL: sourceloop@sourceloop.local
      SOURCELOOP_SMTP_HOST: mail
      SOURCELOOP_SMTP_PORT: "3025"
      SOURCELOOP_SMTP_USERNAME: ""
      SOURCELOOP_SMTP_PASSWORD: ""
      SOURCELOOP_SMTP_STARTTLS: "false"
      SOURCELOOP_SMTP_SSL: "false"
      SOURCELOOP_MAILBOX_MODE: imap
      SOURCELOOP_IMAP_HOST: mail
      SOURCELOOP_IMAP_PORT: "3143"
      SOURCELOOP_IMAP_USERNAME: sourceloop
      SOURCELOOP_IMAP_PASSWORD: devpassword
      SOURCELOOP_IMAP_SSL: "false"
      SOURCELOOP_IMAP_STARTTLS: "false"
      SOURCELOOP_IMAP_POLL_SECONDS: "2"
      SOURCELOOP_IMAP_MARK_SEEN: "true"
      SOURCELOOP_IMAP_SEARCH_CRITERION: UNSEEN
      SOURCELOOP_IMAP_MAX_MESSAGES: "50"
      SOURCELOOP_ATTACHMENT_MAX_BYTES: "10485760"
      SOURCELOOP_WORKER_ID: mailbox-worker
      SOURCELOOP_WORKER_HEARTBEAT_SECONDS: "5"
      SOURCELOOP_CORS_ORIGINS: http://localhost:8080
    depends_on:
      mail:
        condition: service_started

  worker:
    environment:
      SOURCELOOP_ENVIRONMENT: sandbox
      SOURCELOOP_DATABASE_URL: postgresql+psycopg://sourceloop:${SOURCELOOP_DB_PASSWORD:-change-me-local}@db:5432/sourceloop
      SOURCELOOP_EVIDENCE_DIR: /data/evidence
      SOURCELOOP_AGENT_RUNTIME: mock
      SOURCELOOP_EMAIL_MODE: smtp
      SOURCELOOP_ALLOW_EXTERNAL_SEND: "true"
      SOURCELOOP_SENDER_NAME: SourceLoop Sandbox
      SOURCELOOP_SENDER_EMAIL: sourceloop@sourceloop.local
      SOURCELOOP_REPLY_TO_EMAIL: sourceloop@sourceloop.local
      SOURCELOOP_SMTP_HOST: mail
      SOURCELOOP_SMTP_PORT: "3025"
      SOURCELOOP_SMTP_USERNAME: ""
      SOURCELOOP_SMTP_PASSWORD: ""
      SOURCELOOP_SMTP_STARTTLS: "false"
      SOURCELOOP_SMTP_SSL: "false"
      SOURCELOOP_MAILBOX_MODE: imap
      SOURCELOOP_IMAP_HOST: mail
      SOURCELOOP_IMAP_PORT: "3143"
      SOURCELOOP_IMAP_USERNAME: sourceloop
      SOURCELOOP_IMAP_PASSWORD: devpassword
      SOURCELOOP_IMAP_SSL: "false"
      SOURCELOOP_IMAP_STARTTLS: "false"
      SOURCELOOP_IMAP_POLL_SECONDS: "2"
      SOURCELOOP_IMAP_MARK_SEEN: "true"
      SOURCELOOP_IMAP_SEARCH_CRITERION: UNSEEN
      SOURCELOOP_IMAP_MAX_MESSAGES: "50"
      SOURCELOOP_ATTACHMENT_MAX_BYTES: "10485760"
      SOURCELOOP_WORKER_ID: mailbox-worker
      SOURCELOOP_WORKER_HEARTBEAT_SECONDS: "5"
      SOURCELOOP_CORS_ORIGINS: http://localhost:8080
    depends_on:
      mail:
        condition: service_started
