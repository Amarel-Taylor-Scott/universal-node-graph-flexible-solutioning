[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sourceloop"
version = "0.1.0"
description = "Approval-gated direct-source intelligence and request-to-quote practitioner runtime"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Universal Node Graph Flexible Solutioning" }]
dependencies = [
  "fastapi>=0.115,<1",
  "networkx>=3.4,<4",
  "pydantic>=2.9,<3",
  "PyYAML>=6,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]
postgres = ["psycopg[binary]>=3.2,<4"]
geo = [
  "city2graph>=0.2,<1",
  "geopandas>=1.0,<2",
  "shapely>=2.0,<3",
]

[project.scripts]
sourceloop = "sourceloop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sourceloop"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
