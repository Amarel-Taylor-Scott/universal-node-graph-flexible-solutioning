id: bpo_quote
name: BPO and Outsourcing Quote Desk
description: Direct-source pricing, capacity, operational, and security intelligence for outsourced business services.
case_kind: quote_intelligence
max_contacts: 8
max_followups: 1
completion_target: 3
required_fields:
  - service
optional_fields:
  - seats
  - languages
  - coverage
  - start_window
  - security_requirements
  - minimum_quotes
specialist_roles:
  - requirement_compiler
  - provider_scout
  - delivery_location_scout
  - contact_resolver
  - quote_extractor
  - terms_auditor
prohibited_actions:
  - hidden_requester
  - autonomous_contract_acceptance
  - autonomous_purchase
  - competitor_quote_disclosure
question_prompts:
  - What hourly, seat, FTE, contact, or outcome pricing unit applies?
  - What implementation, training, technology, shift, and overtime fees apply?
  - What delivery locations, security controls, capacity, and ramp time apply?
  - What minimum commitments, payment terms, exclusions, and validity apply?
critical_quote_fields:
  - payment_terms
  - quote_validity
followup_approval_required: true
comparison_dimensions:
  - normalized_cost
  - ramp_time
  - capacity
  - security_fit
  - minimum_commitment
  - exclusions
